{% extends "layout.html" %}
{% block content %}
<div class="alert alert-warning" role="alert">
  <h4 class="alert-heading">VDI Session Required</h4>
  <p>
    The application <strong>{{ app }}</strong> can only be launched from within a VDI session.
  </p>
  <hr />
  <div class="mt-3">
    <a href="/projects/{{ project }}/apps" class="btn btn-secondary">Back to Apps</a>
    <a href="/launch/{{ project }}/vdi" class="btn btn-primary">Launch VDI</a>
  </div>
</div>
{% endblock %}
